<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEBSITE DESTROYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+Da+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05060f; --panel:rgba(12,16,40,.86); --panel2:rgba(24,30,70,.9);
  --cyan:#27e8ff; --blue:#2e7bff; --purple:#a35bff; --pink:#ff4fd8; --orange:#ff9a2e; --red:#ff3b4f; --green:#3dff9a;
  --text:#eaf0ff; --muted:#9aa6d6; --ink:#0a0a1e;
  --f-head:'Bangers','Baloo Da 2','Comic Sans MS','Chalkboard SE',cursive;
  --f-body:'Fredoka','Baloo Da 2','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html[lang=bn]{--f-head:'Baloo Da 2','Bangers','Comic Sans MS',cursive}
html[lang=bn] h1,html[lang=bn] h2,html[lang=bn] h3{font-weight:800;letter-spacing:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:14px 14px 28px}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--f-head);font-weight:400;letter-spacing:.05em;margin:.2em 0;text-transform:uppercase}
h2{font-size:clamp(1.8rem,5vw,2.8rem);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 24px rgba(39,232,255,.55)}
html[lang=bn] h2{-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),0 0 20px rgba(39,232,255,.5);text-transform:none}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn{font-family:var(--f-head);font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;padding:.55em 1.1em;border:3px solid var(--ink);border-radius:16px;
  background:linear-gradient(#5cf0ff,#1f8fff);color:#04122a;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(39,232,255,.45);cursor:pointer;transition:transform .08s,filter .15s;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em;text-align:center}
html[lang=bn] .btn{font-weight:800;letter-spacing:0;font-size:1.1rem;text-transform:none}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:linear-gradient(#ff8be8,#c93bff);color:#2a0536;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(255,79,216,.45)}
.btn.orange{background:linear-gradient(#ffd36b,#ff7a1f);color:#341500;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(255,154,46,.5)}
.btn.green{background:linear-gradient(#8bffc2,#17c978);color:#032a17;box-shadow:0 5px 0 var(--ink),0 0 18px rgba(61,255,154,.4)}
.btn.ghost{background:rgba(20,26,60,.9);color:var(--text);box-shadow:0 5px 0 var(--ink)}
.btn.sm{font-size:1rem;min-height:38px;padding:.35em .8em;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink),0 0 30px rgba(120,80,255,.25);padding:16px;backdrop-filter:blur(6px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.muted{color:var(--muted)}
.err{color:#ff7b8a;min-height:1.4em;font-weight:600}
input[type=text],input[type=url]{width:100%;font-family:var(--f-body);font-size:1.15rem;font-weight:600;padding:.7em .9em;border-radius:14px;border:3px solid var(--ink);background:#0d1233;color:#fff;box-shadow:inset 0 0 0 2px rgba(39,232,255,.35),0 4px 0 var(--ink)}
input::placeholder{color:#6c78b8}
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:30;display:flex;gap:6px}
.langtog{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.langtog button{font-family:var(--f-body);font-weight:700;font-size:.95rem;padding:.3em .7em;background:#141a45;color:var(--muted);border:0;cursor:pointer;min-height:38px}
.langtog button[aria-pressed=true]{background:var(--cyan);color:#04122a}
/* menu */
#scrMenu{justify-content:center;text-align:center;gap:6px}
.logo{font-family:var(--f-head);font-size:clamp(2.6rem,10vw,6rem);line-height:.95;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(163,91,255,.8);margin:0;animation:bob 3s ease-in-out infinite}
.logo span{color:var(--orange)}
html[lang=bn] .logo{-webkit-text-stroke:0;font-family:'Bangers','Baloo Da 2',cursive}
.tag{font-weight:600;color:var(--cyan);font-size:clamp(.95rem,2.5vw,1.3rem);margin:.3em 0 1em}
.menuBtns{display:grid;gap:14px;width:min(360px,92vw);margin-top:6px}
.menuBtns .btn{font-size:1.5rem}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
.logomark{width:110px;height:110px}
/* char select */
#scrChar{text-align:center}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:min(1100px,100%);margin:10px 0}
.ccard{text-align:left;position:relative;transition:transform .15s}
.ccard.sel{outline:4px solid var(--orange);transform:translateY(-4px)}
.ccard canvas{width:100%;height:170px;background:radial-gradient(circle at 50% 70%,rgba(163,91,255,.35),transparent 70%);border-radius:14px;display:block}
.ccard h3{font-size:1.7rem;margin:.1em 0}
.ccard p{margin:.2em 0;font-size:.92rem;color:#cfd8ff}
.ccard .wp{color:var(--orange);font-weight:700}
.stat{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;font-size:.8rem;margin:3px 0}
.bar{height:10px;border-radius:6px;background:#0a0f2c;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}
/* name & url */
.center{margin:auto;width:min(560px,100%);text-align:center}
.stack{display:grid;gap:12px}
.preview{margin-top:14px;text-align:left}
.pvbox{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#0d1233;box-shadow:0 0 0 2px var(--cyan)}
.pvbox iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.pvload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.82);gap:10px;font-weight:600}
.spin{width:44px;height:44px;border-radius:50%;border:6px solid #25306e;border-top-color:var(--cyan);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dom{font-family:var(--f-head);font-size:1.6rem;color:var(--orange);word-break:break-all}
html[lang=bn] .dom{font-family:'Baloo Da 2'}
/* game: the playable world fills the screen, the HUD floats on top */
#scrGame{padding:0;overflow:hidden;align-items:stretch}
#gameHost{position:absolute;inset:0;background:#05060f;touch-action:none;overflow:hidden}
#gameHost canvas{display:block}
#hudTop{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#hudTop>*{pointer-events:auto}
#hud{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 8px;background:linear-gradient(rgba(5,8,26,.94),rgba(5,8,26,.7));border-bottom:3px solid var(--ink);flex-wrap:wrap}
#hud .brand{font-family:var(--f-head);font-size:1.25rem;color:#fff;-webkit-text-stroke:1px var(--ink);letter-spacing:.05em}
#hud .who{font-size:.85rem;line-height:1.15}
#hud .who b{color:var(--cyan)}
.score{font-family:var(--f-head);font-size:1.6rem;color:var(--orange);min-width:90px;text-align:center}
html[lang=bn] .score,html[lang=bn] #hud .brand{font-family:'Bangers','Baloo Da 2'}
#timerRow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:4px 10px;background:rgba(5,8,26,.72)}
#timer{font-family:var(--f-head);font-size:clamp(2rem,6vw,3.4rem);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 20px rgba(39,232,255,.7);min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
#timer.urgent{color:var(--red);animation:pulse .5s infinite;text-shadow:0 4px 0 var(--ink),0 0 26px var(--red)}
@keyframes pulse{50%{transform:scale(1.12)}}
.prog{position:relative;height:26px;border:3px solid var(--ink);border-radius:14px;background:#0a0f2c;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff3b4f,var(--orange),var(--pink));box-shadow:0 0 14px var(--orange);transition:width .12s}
.prog u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;text-shadow:0 1px 2px #000}
#modeRow{display:flex;gap:6px;flex-wrap:wrap;padding:4px 8px;align-items:center}
.chip{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:.2em .65em;font-weight:600;font-size:.82rem}
.chip b{color:var(--orange)}
.chip.sim{border-color:var(--orange)}
.fuelchip{display:flex;gap:6px;align-items:center}
.fuelchip .bar{width:70px;height:10px}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);z-index:7;font-family:var(--f-head);font-size:clamp(1.3rem,4.5vw,2.8rem);color:var(--orange);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;text-align:center;opacity:0;white-space:nowrap;max-width:96%}
html[lang=bn] #toast{-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),0 0 14px #000}
#toast.show{animation:toast 1.8s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.4)}12%{opacity:1;transform:translateX(-50%) scale(1.15)}22%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(1)}}
#wpn{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 6px;pointer-events:none;font-size:.9rem}
#wpn>*{pointer-events:auto}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);z-index:4;font-size:.78rem;color:var(--muted);text-align:center;pointer-events:none;text-shadow:0 1px 3px #000}
#gameLoading{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.88);gap:12px;font-weight:600}
#touchUI{display:none;position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:6;justify-content:space-between;align-items:flex-end;padding:0 10px;gap:8px;pointer-events:none;user-select:none;-webkit-user-select:none}
body.touch #touchUI{display:flex}
body.touch #hint{display:none}
body.touch #wpn{bottom:calc(env(safe-area-inset-bottom,0px) + 148px)}
.tcl,.tcr{display:flex;gap:10px;align-items:flex-end}
.tb{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);background:rgba(39,232,255,.34);color:#fff;font-family:var(--f-head);font-size:1.2rem;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 var(--ink);backdrop-filter:blur(3px);pointer-events:auto}
.tb.big{width:84px;height:84px}
.tb.on{background:var(--orange);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tb.fire{background:rgba(255,59,79,.6)} .tb.jump{background:rgba(163,91,255,.6)} .tb.sw{background:rgba(255,154,46,.55);width:58px;height:58px}
@media (orientation:landscape) and (max-height:560px){
  body.touch #wpn{bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
  #hud .brand,#hint,#modeRow .fuelchip{display:none}
  #timerRow{padding:2px 10px} #timer{font-size:2rem}
  .tb{width:62px;height:62px} .tb.big{width:70px;height:70px}
}
@media (max-width:640px){#hud .who{font-size:.75rem}.score{font-size:1.3rem}#hud .brand{display:none}}
@media (max-width:900px){#wpn .btn .wn{display:none}#wpn .btn.orange .wn{display:inline}#wpn .chip{display:none}#wpn .btn.sm{padding:.25em .6em;min-height:34px}}
#pvCanvas{width:100%;aspect-ratio:1280/563;display:block;background:#0d1233}
#pvOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#pvLoad{background:rgba(5,6,15,.6)}
.pvtag{position:absolute;left:8px;top:8px;padding:.15em .65em;border-radius:10px;font-weight:700;font-size:.78rem;border:2px solid var(--ink);background:#17c978;color:#04122a;z-index:2}
.pvtag.sim{background:#ff9a2e}
/* dev credits box on the main menu */
.devbox{margin-top:14px;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--panel2);box-shadow:0 4px 0 var(--ink);display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.devbox .who{font-size:.85rem;color:var(--muted)}
.devbox .who b{color:var(--cyan)}
.devbox a{font-weight:700;text-decoration:none;border-radius:10px;padding:.15em .5em;transition:filter .15s}
.devbox a:hover{filter:brightness(1.2)}
.devbox .port{color:var(--orange)}
.devbox .gh{color:#fff;background:#1b2260;border:2px solid var(--ink)}
/* username suggestion chip */
.sug{display:none;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border:3px dashed var(--purple);border-radius:14px;background:rgba(163,91,255,.12);font-size:.9rem;text-align:left}
.sug.show{display:flex}
.sug .txt{color:var(--muted)}
.sug .val{font-weight:800;color:var(--purple);font-family:var(--f-head);letter-spacing:.04em}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,3,12,.78);padding:14px;overflow-y:auto}
.ov.on{display:flex}
.modal{width:min(640px,100%);max-height:94dvh;overflow-y:auto;text-align:left}
.modal h2{text-align:center}
.modal h3{color:var(--orange);font-size:1.3rem}
.modal ul{padding-left:1.2em;margin:.3em 0}
.modal li{margin:.25em 0}
table.k{width:100%;border-collapse:collapse;font-size:.92rem}
table.k td{padding:4px 6px;border-bottom:1px solid #26306e}
kbd{font-family:var(--f-head);background:#1b2260;border:2px solid var(--ink);border-radius:8px;padding:0 .5em;color:var(--cyan);box-shadow:0 2px 0 var(--ink)}
.res h2{margin-bottom:0}
.res .big{font-family:var(--f-head);font-size:3rem;color:var(--orange);text-align:center;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;line-height:1}
.brk{width:100%;font-size:.95rem;border-collapse:collapse}
.brk td{padding:3px 6px;border-bottom:1px dashed #2a3478}
.brk td:last-child{text-align:right;font-weight:700;color:var(--cyan)}
.sharebox{margin-top:12px;border:3px dashed var(--purple);border-radius:16px;padding:10px;background:rgba(40,20,90,.35)}
.sharebox textarea{width:100%;min-height:78px;resize:vertical;font-family:var(--f-body);font-size:.9rem;background:#0d1233;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px}
.shgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shgrid .btn{flex:1 1 120px}
.lbstat{font-size:.85rem;margin:6px 0;min-height:1.3em}
.vol{display:grid;grid-template-columns:1fr 2fr;gap:6px 10px;align-items:center;margin:8px 0}
input[type=range]{accent-color:var(--cyan);width:100%}
/* leaderboard */
#lbList{width:min(720px,100%);display:grid;gap:8px;margin:10px 0}
.lbr{display:grid;grid-template-columns:44px 52px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:16px;background:var(--panel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.lbr.r1{background:linear-gradient(90deg,rgba(255,200,40,.3),var(--panel));border-color:#ffd24a}
.lbr.r2{background:linear-gradient(90deg,rgba(210,220,240,.25),var(--panel));border-color:#cfd8e8}
.lbr.r3{background:linear-gradient(90deg,rgba(220,130,60,.28),var(--panel));border-color:#e08a4a}
.lbr .rk{font-family:var(--f-head);font-size:1.8rem;text-align:center}
.lbr canvas{width:52px;height:52px;background:rgba(163,91,255,.25);border-radius:12px}
.lbr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .sub{font-size:.78rem;color:var(--muted)}
.lbr .sc{text-align:right;font-family:var(--f-head);font-size:1.5rem;color:var(--orange)}
.lbr .sc small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted)}
.skel{height:68px;border-radius:16px;background:linear-gradient(90deg,#10153a,#1b2260,#10153a);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.banner{width:min(720px,100%);padding:10px 14px;border-radius:14px;border:3px solid var(--orange);background:rgba(255,154,46,.12);font-size:.9rem}
.lastcard{margin-top:16px;text-align:left}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">

<!-- MENU -->
<section class="screen on" id="scrMenu" aria-labelledby="mLogo">
  <svg class="logomark" viewBox="0 0 120 120" aria-hidden="true">
    <defs><radialGradient id="bhg"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#1a0933"/><stop offset="1" stop-color="#a35bff"/></radialGradient></defs>
    <circle cx="60" cy="60" r="52" fill="url(#bhg)" stroke="#0a0a1e" stroke-width="4"/>
    <ellipse cx="60" cy="60" rx="56" ry="14" fill="none" stroke="#ff9a2e" stroke-width="5" transform="rotate(-20 60 60)"/>
    <rect x="18" y="26" width="46" height="34" rx="5" fill="#eaf0ff" stroke="#0a0a1e" stroke-width="3" transform="rotate(-12 40 43)"/>
    <path d="M24 34 l8 9 -6 6 10 8" stroke="#ff3b4f" stroke-width="3" fill="none" transform="rotate(-12 40 43)"/>
    <circle cx="86" cy="78" r="15" fill="#fff" stroke="#0a0a1e" stroke-width="3"/><ellipse cx="86" cy="79" rx="10" ry="8" fill="#27e8ff" stroke="#0a0a1e" stroke-width="2"/>
  </svg>
  <h1 class="logo" id="mLogo">WEBSITE<br><span>DESTROYER</span></h1>
  <p class="tag" data-i="tagline"></p>
  <div class="menuBtns">
    <button class="btn orange" id="bPlay" data-i="play"></button>
    <button class="btn pink" id="bChars" data-i="chooseChar"></button>
    <button class="btn" id="bBoard" data-i="leaderboard"></button>
    <button class="btn ghost" id="bHow" data-i="howto"></button>
    <button class="btn ghost" id="bSettings" data-i="soundSettings"></button>
  </div>
  <div class="devbox" id="devBox">
    <span class="who">🎮 <span data-i="devBy"></span> <b>Md. Ashraful Islam</b></span>
   
  </div>
</section>

<!-- CHARACTERS -->
<section class="screen" id="scrChar">
  <h2 data-i="chooseChar"></h2>
  <div class="chars" id="chars"></div>
  <div class="card" id="confirmPanel" style="min-width:min(520px,100%)">
    <div id="confirmTxt" style="font-weight:600"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" data-back="MENU" data-i="back"></button>
      <button class="btn orange" id="bCharCont" data-i="continue"></button>
    </div>
  </div>
</section>

<!-- NAME -->
<section class="screen" id="scrName">
  <div class="center card" style="margin-top:6vh">
    <h2 data-i="nickTitle"></h2>
    <canvas id="nameChar" width="240" height="190" style="width:200px;height:158px" aria-hidden="true"></canvas>
    <p class="muted" data-i="nickHint"></p>
    <label for="nick" class="muted" style="display:block;text-align:left;font-weight:600;margin-bottom:4px" data-i="nickLabel"></label>

function checkNick(s){
  const len=[...s].length; if (len<3) return 'nickShort'; if (len>16) return 'nickLong';
  if (!/^[\p{L}\p{N}\p{M}_\- ]+$/u.test(s)) return 'nickBad';
  const map={'0':'o','1':'i','3':'e','4':'a','5':'s','$':'s','@':'a','!':'i'};
  const low=s.toLowerCase().replace(/[01345$@!]/g,m=>map[m]).replace(/[\s_\-]/g,'');
  if (BAD_WORDS.some(w=>low.includes(w))) return 'nickRude';
  return null;
}
/* ---- Smart username auto-suggestion ---- */
/* Known names: local bests, global leaderboard cache, and the backend leaderboard. */
const takenNames = () => {
  const set = new Set();
  try {
    (lsGet('wd_bests', []) || []).forEach(r => { if (r && r.nick) set.add(String(r.nick).toLowerCase()); });
  } catch (e) {}
  try {
    const rows = (LB_CACHE && LB_CACHE.rows) || [];
    rows.forEach(r => { if (r && r.name) set.add(String(r.name).toLowerCase()); });
  } catch (e) {}
  return set;
};
function suggestVariant(base) {
  const taken = takenNames();
  const clean = base.replace(/[\s_\-]+$/, '');
  if (!taken.has(clean.toLowerCase())) return clean;
  for (let n = 2; n <= 999; n++) {
    const cand = (clean + n).slice(0, 16);
    if (!taken.has(cand.toLowerCase())) return cand;
  }
  return clean.slice(0, 12) + String(Date.now() % 1000);
}

  const taken = takenNames();
  if (!taken.has(s.toLowerCase())) { SUG = null; $('#sugBox').classList.remove('show'); return; }

/* ============ URL ENTRY ============ */
function isPrivateHost(h){
  h=h.toLowerCase();
  if (h==='localhost'||/\.(localhost|local|internal|lan|home|corp|test|invalid)$/.test(h)) return true;
  if (h.startsWith('[')||h.includes(':')) return true;
  const m=h.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (m){ const [a,b]=[+m[1],+m[2]]; return a===0||a===10||a===127||a>=224||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&b===168)||(a===100&&b>=64&&b<=127); }
  return !h.includes('.');
}
function parseUrl(raw){
  let s=(raw||'').trim(); if (!s) return {err:'urlEmpty'};
  if (/^[a-z][a-z0-9+.\-]*:/i.test(s) && !/^https?:\/\//i.test(s)){ if (!/^[^/]+\.[a-z]{2,}(:\d+)?(\/|$)/i.test(s)) return {err:'urlScheme'}; }
  if (!/^https?:\/\//i.test(s)) s='https://'+s;
  let u; try{ u=new URL(s); }catch(e){ return {err:'urlInvalid'}; }
  if (u.protocol!=='http:'&&u.protocol!=='https:') return {err:'urlScheme'};
  if (u.username||u.password) return {err:'urlCreds'};
  if (isPrivateHost(u.hostname)) return {err:/\./.test(u.hostname)||u.hostname==='localhost'?'urlPrivate':'urlInvalid'};
  if (!/^[\p{L}\p{N}.\-]+$/u.test(u.hostname)) return {err:'urlInvalid'};
  return {url:u.href, domain:u.hostname.replace(/^www\./,'')};
}

/* Live capture: the Cloudflare Worker (Browser Rendering) returns a picture of the real page (5-20 s). The game only ever receives an image. */
async function captureSite(r,tok){
  if (!/^https?:$/.test(location.protocol)) return false;
  if (BE && BE.capture===false) return false;
  const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),CAPTURE_MS), t0=performance.now();
  const tick=setInterval(()=>{ if (tok!==loadTok) return; const e=(performance.now()-t0)/1000; $('#pvLoadTxt').textContent=t(e<5?'capOpen':e<11?'capLazy':'capFonts'); $('#capBar').style.width=Math.min(94,e/24*100)+'%'; },300);
  try{
    const res=await fetch(SNAPSHOT_ENDPOINT+'?url='+encodeURIComponent(r.url),{signal:ctrl.signal,cache:'no-store'});
    if (!res.ok || !/^image\//.test(res.headers.get('content-type')||'')) return false;
    const blob=await res.blob();
    const dataUrl=await new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsDataURL(blob); });
    const img=await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=dataUrl; });
    if (tok!==loadTok) return true;
    TARGET.shot=img; TARGET.mode='capture'; TARGET.ready=true; $('#capBar').style.width='100%';
    return true;
  }catch(e){ return false; }
  finally{ clearTimeout(to); clearInterval(tick); }
}

const cmpRows=(a,b)=>b.score-a.score||a.timeMs-b.timeMs||a.at-b.at;
async function submitGlobal(rec){
  if (!rec.win){ rec.lb='lbDefeatNote'; return; }
  if (submitted.has(rec.id)) return; submitted.add(rec.id);
  if (BE && BE.leaderboard){
    if (!rec.token){ rec.lb='lbFail'; refreshLbStat(rec); return; }
    rec.lb='lbSaving'; refreshLbStat(rec);
    try{ const r=await fetch('/api/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rid:rec.token.rid,ts:rec.token.ts,sig:rec.token.sig,pid:playerId(),name:rec.nick,char:rec.char,score:rec.score,b:rec.b,pct:100,timeMs:rec.timeMs})});
      const j=await r.json().catch(()=>({})); rec.lb = r.ok && j.status==='saved' ? 'lbSaved' : r.ok && j.status==='not_best' ? 'lbNotBest' : 'lbFail'; }catch(e){ rec.lb='lbFail'; }
    refreshLbStat(rec); return;
  }
  if (!DBX || !DBW){ rec.lb='lbOffline'; refreshLbStat(rec); return; }
  const row={name:rec.nick,char:rec.char,score:rec.score,timeMs:rec.timeMs,pct:100,at:Date.now()};
  if (!validRow(row) || checkNick(rec.nick) || Date.now()-lastSubmit<4000){ rec.lb='lbFail'; refreshLbStat(rec); return; }
  lastSubmit=Date.now(); rec.lb='lbSaving'; refreshLbStat(rec);
  try{ const ref=DBX.doc('scores/'+UID), snap=await ref.get();
    if (snap.exists){ const o=snap.data(); if (validRow(o) && (o.score>row.score || (o.score===row.score && o.timeMs<=row.timeMs))){ rec.lb='lbNotBest'; refreshLbStat(rec); return; } }
    await ref.set(row); rec.lb='lbSaved';
  }catch(e){ rec.lb='lbFail'; }
  refreshLbStat(rec);
}
let lbTok=0;
async function loadBoard(){
  const tok=++lbTok, list=$('#lbList'); list.innerHTML=''; $('#lbBanner').classList.add('hide'); $('#lbUpd').textContent='';
  for (let i=0;i<5;i++){ const s=document.createElement('div'); s.className='skel'; list.append(s); }
  const stamp=()=>{ $('#lbUpd').textContent=t('lbUpdated',{t:new Date().toLocaleTimeString(LANG==='bn'?'bn-BD':'en-US')}); };
  if (BE && BE.leaderboard){
    try{ const r=await fetch('/api/leaderboard',{cache:'no-store'}); if (!r.ok) throw new Error('http'); const j=await r.json(); if (tok!==lbTok) return;
      const rows=(j.rows||[]).map(x=>({name:x.name,char:x.char,score:x.score,timeMs:x.timeMs,pct:x.pct,at:x.at})).filter(validRow).sort(cmpRows).slice(0,10);
      LB_CACHE = { rows }; renderRows(rows); stamp();
    }catch(e){ if (tok!==lbTok) return; list.innerHTML=''; const m=document.createElement('div'); m.className='banner'; m.textContent=t('lbError'); list.append(m); }
    return;
  }
  if (!DBX){
    const rows=lsGet('wd_bests',[]).map(r=>Object.assign({name:r.nick},r)).filter(validRow).sort(cmpRows).slice(0,10);
    LB_CACHE = { rows };
    $('#lbBanner').textContent=t('lbDemo'); $('#lbBanner').classList.remove('hide'); renderRows(rows); stamp(); return;
  }
  try{ const snap=await DBX.collection('scores').orderBy('score','desc').limit(100).get(); if (tok!==lbTok) return;
    const rows=snap.docs.map(d=>d.data()).filter(validRow).sort(cmpRows).slice(0,10);
    LB_CACHE = { rows }; renderRows(rows); stamp();
  }catch(e){ if (tok!==lbTok) return; list.innerHTML=''; const m=document.createElement('div'); m.className='banner'; m.textContent=t('lbError'); list.append(m); }
}
function renderRows(rows){
  const list=$('#lbList'); list.innerHTML='';
  if (!rows.length){ const m=document.createElement('div'); m.className='banner'; m.textContent=t('lbEmpty'); list.append(m); return; }
  rows.forEach((r,i)=>{ const d=document.createElement('div'); d.className='lbr'+(i<3?' r'+(i+1):'');
    const rk=document.createElement('div'); rk.className='rk'; rk.textContent=['🥇','🥈','🥉'][i]||String(i+1); rk.setAttribute('aria-label',t('lbRank')+' '+(i+1));
    const cvs=document.createElement('canvas'); cvs.width=104; cvs.height=104; drawChar(cvs.getContext('2d'),r.char,52,98,{s:1.35,face:1,t:1,aim:-.2,mood:'happy'});
    const mid=document.createElement('div'); mid.style.minWidth='0'; const nm=document.createElement('div'); nm.className='nm'; nm.textContent=r.name; const sub=document.createElement('div'); sub.className='sub'; sub.textContent=ta('cName')[r.char]+' • '+t('complete'); mid.append(nm,sub);
    const sc=document.createElement('div'); sc.className='sc'; sc.textContent=r.score.toLocaleString('en-US'); const sm=document.createElement('small'); sm.textContent=fmtTime(r.timeMs); sc.append(sm);
    d.append(rk,cvs,mid,sc); list.append(d); });
}

/* ============ INPUT (game keys, mouse aiming and touch are handled inside the engine; here only UI-level keys + virtual buttons) ============ */
addEventListener('keydown',e=>{
  if (e.code==='Escape'){
    if ($('#ovHow').classList.contains('on')){ closeHow(); e.stopImmediatePropagation(); return; }
    if ($('#ovSet').classList.contains('on')){ $('#ovSet').classList.remove('on'); e.stopImmediatePropagation(); return; }
    if (ENG && ENG.paused && $('#ovPause').classList.contains('on')){ setPause(false); e.stopImmediatePropagation(); return; }
    return;
  }
  const tag=e.target.tagName; if (/INPUT|TEXTAREA|SELECT/.test(tag) && e.target.type!=='range' && e.target.type!=='checkbox'){ if (e.code==='Enter'){ if (e.target.id==='nick') submitNick(); if (e.target.id==='url') loadWebsite(); } return; }
}, true);
document.addEventListener('visibilitychange',()=>{ if (document.hidden && ENG && state==='PLAYING' && !ENG.paused) setPause(true); });
if ('ontouchstart' in window || navigator.maxTouchPoints>0) document.body.classList.add('touch');
$$('.tb').forEach(b=>{ const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); auInit(); try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('on'); if (!ENG) return;
    if (k==='switch'){ ENG.switchWeapon(); return; } ENG.setVirtual(k,true); });
  const off=()=>{ b.classList.remove('on'); if (ENG && k!=='switch') ENG.setVirtual(k,false); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off)); b.addEventListener('contextmenu',e=>e.preventDefault()); });

$('#bHow2').onclick=()=>{ auInit(); sfx('ui'); openHow('info'); };

$('#bCharCont').onclick=()=>{ auInit(); sfx('ui'); PREF.charPicked=true; savePrefs(); go('NAME'); $('#nick').focus(); };
$('#bNick').onclick=submitNick;
$('#bLoad').onclick=loadWebsite;
$('#bUseSim').onclick=useSim; $('#bGameFs').onclick=()=>toggleFs($('#scrGame'));

$$('[data-back]').forEach(b=>b.onclick=()=>{ sfx('ui'); go(b.dataset.back); });

$('#bBoardRetry').onclick=loadBoard;
$$('.js-lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$$('.js-sound').forEach(b=>b.onclick=()=>{ if (b.id==='bMute'){ toggleMute(); } else { auInit(); toggleMute(); } });
$('#bPause').onclick=e=>{ setPause(true); e.currentTarget.blur(); };
$('#bResume').onclick=()=>setPause(false);
$('#bRestart').onclick=()=>confirmTwice('r','restartAsk',()=>{ musicStop(); startRound(); });
$('#bPMenu').onclick=()=>confirmTwice('m','menuAsk',()=>{ musicStop(); $('#ovPause').classList.remove('on'); if (ENG) ENG.resume(); go('MENU'); });
$('#bPSound').onclick=openSettings;
$('#bPCtl').onclick=()=>openHow('info');
[['#vM','vm'],['#vS','vs'],['#vU','vu']].forEach(([s,k])=>$(s).oninput=e=>{ PREF[k]=e.target.value/100; savePrefs(); auInit(); auApply(); });
$('#vS').onchange=()=>sfx('laser');

/* ============ MAIN LOOP ============ */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-lastT)/1000); lastT=now;
  try{
    if (inGame()){ if (ENG) updateHUD(); }
    else { renderBg(dt); if (state==='CHAR') CHAR_IDS.forEach(id=>CARDS[id] && drawPreview(CARDS[id],dt)); }
    if (state==='NAME'){ const c=$('#nameChar').getContext('2d'); c.clearRect(0,0,240,190); drawChar(c,PREF.char,120,170,{s:2.1,face:1,t:now/1000,aim:-.2}); }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function init(){ LANG=PREF.lang==='bn'?'bn':'en'; applyLang(); auApply(); go('MENU'); requestAnimationFrame(frame); initBackend(); initDb(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ hudCache={}; });
  // auto-suggestion on the nickname screen
  $('#nick').addEventListener('input', updateSuggestion);
  $('#bSugAccept').addEventListener('click', () => {
    if (!SUG) return;
    PREF.nick = SUG; savePrefs(); sfx('ui'); $('#nick').value = SUG; updateSuggestion(); $('#sugBox').classList.remove('show');
  });
  $('#bSugKeep').addEventListener('click', () => {
    $('#nick').focus(); $('#sugBox').classList.remove('show');
  });
}
init();
